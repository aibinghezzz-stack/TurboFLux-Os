appId: dev.turboflux.desktop
productName: TurboFlux
artifactName: TurboFlux-${version}-${os}-${arch}.${ext}
asar: true
asarUnpack:
  - node_modules/esbuild/**/*
  - node_modules/@esbuild/**/*
electronDist: node_modules/electron/dist
directories:
  output: ../../release
files:
  - main.mjs
  - preload.cjs
  - runtimeHost.ts
  - productExperience.ts
  - conversationPolicy.ts
  - contextUsageRecovery.ts
  - desktopTypes.ts
  - historyRewrite.ts
  - runtimeTransitionPolicy.ts
  - taskTitleGenerator.ts
  - taskTitleApplyGate.ts
  - browser/**/*
  - computer/**/*.ts
  - computer/**/*.cjs
  - systems/**/*.ts
  - package.json
  - node_modules/**/*
extraResources:
  - from: ../../dist-desktop/renderer
    to: renderer
  - from: ../../apps/website/public/turboflux-app-icon.png
    to: renderer/turboflux-app-icon.png
  - from: generated/native
    to: native
afterPack: build/sign-desktop-helper.mjs
afterSign: build/notarize-desktop.mjs
mac:
  category: public.app-category.productivity
  icon: generated/TurboFlux.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  target:
    - dmg
    - zip
dmg:
  sign: false
win:
  icon: ../../apps/website/public/turboflux-app-icon.png
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
linux:
  category: Utility
  icon: ../../apps/website/public/turboflux-app-icon.png
  target:
    - AppImage
    - deb
